[project]
name = "fullbay-mcp"
version = "1.1.0"
description = "Connect Fullbay to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Fullbay API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["fullbay", "fullbay api", "fullbay mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/mcp/fullbay?utm_source=pypi&utm_medium=package&utm_campaign=fullbay"
Source = "https://github.com/cotlet-connect/fullbay-mcp"

[project.scripts]
fullbay-mcp = "fullbay_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"fullbay_agent.py" = "fullbay_agent.py"

[tool.hatch.build.targets.sdist]
include = ["fullbay_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
